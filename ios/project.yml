name: SnowForecast
options:
  bundleIdPrefix: com.snowforecast.northeast
  deploymentTarget:
    iOS: "17.0"
packages:
  SnowForecastKit:
    path: Packages/SnowForecastKit
targets:
  SnowForecast:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: SnowForecastApp
        excludes:
          - Info.plist
    info:
      path: SnowForecastApp/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.snowforecast.northeast.app
        TARGETED_DEVICE_FAMILY: "1" # iPhone only
        SWIFT_VERSION: "5.0"
        INFOPLIST_FILE: SnowForecastApp/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: SnowForecastKit
      - target: SnowForecastWidget
  SnowForecastWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: SnowForecastWidget
        excludes:
          - Info.plist
    info:
      path: SnowForecastWidget/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.snowforecast.northeast.app.widget
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        INFOPLIST_FILE: SnowForecastWidget/Info.plist
    dependencies:
      - package: SnowForecastKit
